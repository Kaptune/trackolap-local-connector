# nfpm configuration - builds the tlp-connector .deb AND .rpm from one definition.
#
#   nfpm package -f build/linux/nfpm.yaml -p deb -t dist/
#   nfpm package -f build/linux/nfpm.yaml -p rpm -t dist/
#
# nfpm is a single Go binary that produces both formats without dpkg-dev, rpmbuild or a
# matching host distro, which is what lets one Linux CI job emit every artefact. See
# build/linux/package.sh, which drives it for each architecture.
#
# ${VERSION} and ${ARCH} are read from the environment (nfpm expands env vars).

name: tlp-connector
arch: "${ARCH}"                       # amd64 | arm64 (nfpm maps to x86_64/aarch64 for rpm)
platform: linux
version: "${VERSION}"
section: net
priority: optional
maintainer: TrackOlap <support@trackolap.com>
description: |
  TrackOlap on-premise connector agent.
  Reads local business applications (Tally, ODBC databases) on this machine and syncs
  them into TrackOlap over HTTPS. Runs as a hardened systemd service under its own
  unprivileged system account.
vendor: TrackOlap
homepage: https://www.trackolap.com
license: Proprietary

# A single static CGO-free binary: no libc, no OpenSSL, nothing to pull in. Deliberately
# left empty so the same package installs on Debian, Ubuntu, RHEL, Rocky and Amazon Linux.
depends: []

contents:
  - src: "${DIST}/tlp-connector_linux_${ARCH}"
    dst: /usr/bin/tlp-connector
    file_info:
      mode: 0755

  - src: build/linux/tlp-connector.service
    dst: /lib/systemd/system/tlp-connector.service
    file_info:
      mode: 0644

  # The state directory. type: dir so the package OWNS it and removes it on purge, and
  # 0700 because connector.json holds the agent's HMAC signing secret.
  - dst: /var/lib/trackolap-connector
    type: dir
    file_info:
      mode: 0700
      owner: trackolap-connector
      group: trackolap-connector

  - src: build/README.md
    dst: /usr/share/doc/tlp-connector/README.md
    file_info:
      mode: 0644

scripts:
  preinstall: build/linux/scripts/preinstall.sh
  postinstall: build/linux/scripts/postinstall.sh
  preremove: build/linux/scripts/preremove.sh
  postremove: build/linux/scripts/postremove.sh

deb:
  fields:
    Bugs: https://www.trackolap.com/support
  # Never clobber a config an operator edited; ask instead. (The agent's own config lives
  # under /var/lib and is not a packaged conffile, but this is the correct default.)
  triggers:
    interest_noawait:
      - /lib/systemd/system

rpm:
  group: Applications/Internet
  summary: TrackOlap on-premise connector agent
